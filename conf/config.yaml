storage: /verdaccio/storage

plugins: /verdaccio/plugins

# the e2e battery publishes tarballs larger than the 10mb default
max_body_size: 100mb

auth:
  '@verdaccio/auth-ldap':
    url: LDAP_URL
    baseDN: LDAP_BASE_DN
    bindDN: LDAP_BIND_DN
    bindCredentials: LDAP_BIND_PASSWORD
    searchFilter: '(uid={{username}})'
    groupSearchBase: LDAP_GROUP_SEARCH_BASE
    groupSearchFilter: '(memberUid={{username}})'
    groupAttribute: cn

# no uplink on purpose: the e2e battery only uses packages it publishes itself
packages:
  # reads are open so the battery's raw HTTP checks work; the LDAP plugin is still
  # exercised on every publish and unpublish, which is where authorization matters
  '@*/*':
    access: $all
    publish: $authenticated
    unpublish: $authenticated
  '**':
    access: $all
    publish: $authenticated
    unpublish: $authenticated

log:
  - {type: stdout, format: pretty, level: trace}

listen:
  - 0.0.0.0:4873
